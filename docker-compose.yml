version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs_postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nestjs_tutorial
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16-alpine
    container_name: nestjs_postgres_test
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nestjs_tutorial_test

  redis:
    image: redis:7-alpine
    container_name: nestjs_redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
